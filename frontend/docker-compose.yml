#     ports:
#       - "3000:3000"

#     restart: unless-stopped

version: "3.9"

services:
  frontend:
    build:
      context: .
      args:
        # 🚀 Pulls from your host VPS .env file and passes it to the Dockerfile at BUILD TIME
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: enterprise-rag-frontend
    ports:
      - "3000:3000"
    environment:
      # Safe! This is never exposed to the browser. Next.js reads it purely on the server side.
      - BACKEND_URL=http://164.68.120.179:8000
      # Removed the global env_file block to keep server secrets isolated
      - BACKEND_API_KEY=${BACKEND_API_KEY}
    restart: unless-stopped
