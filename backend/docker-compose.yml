version: "3.9"

services:
  # =====================================================================
  # 1. CORE API GATEWAY SERVICE
  # =====================================================================
  backend:
    build: .
    container_name: enterprise-rag-backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis-broker:6379/0
    volumes:
      - chroma_data:/app/chroma_storage
      - ./uploads:/app/uploads
    networks:
      - enterprise-rag-net
    restart: unless-stopped
    depends_on:
      - redis-broker
      - postgres

  # =====================================================================
  # 2. REDIS TASK BROKER
  # =====================================================================
  redis-broker:
    image: redis:7-alpine
    container_name: enterprise-rag-redis
    networks:
      - enterprise-rag-net
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # =====================================================================
  # 3. DISTRIBUTED CELERY ASYNC WORKER POOL
  # =====================================================================
  celery-worker:
    build: .
    container_name: enterprise-rag-worker
    # Overrides the default CMD to boot up as a worker listening to our app instance
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info -P threads --concurrency=2
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis-broker:6379/0
    volumes:
      - chroma_data:/app/chroma_storage
      - ./uploads:/app/uploads
    networks:
      - enterprise-rag-net
    restart: unless-stopped
    depends_on:
      - redis-broker
      - postgres

  # =====================================================================
  # 4. SYSTEM-OF-RECORD RELATIONAL DATABASE
  # =====================================================================
  postgres:
    image: postgres:16-alpine
    container_name: enterprise-rag-postgres
    restart: unless-stopped
    environment:
      # 🔒 Docker Compose automatically reads these right out of your .env file
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_rag}
    ports:
      - "127.0.0.1:5432:5432" # Bound securely to localhost
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - enterprise-rag-net

 # =====================================================================
  # 5. OPEN-SOURCE TELEMETRY DATA PIPELINE
  # =====================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: enterprise-rag-prometheus
    ports:
      - "127.0.0.1:9090:9090"  # Prometheus UI accessible locally or via SSH tunnel
    volumes:
      # 📂 Mounts the core config directory we created in the last step
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # 💾 MUST ADD THIS: A persistent volume so data survives container updates!
      - prometheus_tsdb:/prometheus 
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - enterprise-rag-net
    restart: unless-stopped
    depends_on:
      - backend  # Wait for the FastAPI app to be ready before starting scrape

# =====================================================================
  # 6. Grafana (Open Source Analytics & Visualization Dashboard)
  # =====================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: enterprise-rag-grafana
    ports:
      - "127.0.0.1:3001:3000"  # 🚀 Changed host mapping to 3001 to avoid Next.js conflict
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false  # Lock down registrations
    volumes:
      - grafana_storage:/var/lib/grafana
    networks:
      - enterprise-rag-net
    restart: unless-stopped
    depends_on:
      - prometheus  # Wait for Prometheus to be available


networks:
  enterprise-rag-net:
    external: true

volumes:
  chroma_data:
  redis_data:
  postgres_data: # 💾 Persistent database volume
  prometheus_tsdb: # 💾 Make sure this volume is declared here!
  grafana_storage: