version: "3.9"

services:
  # =====================================================================
  # 1. CORE API GATEWAY SERVICE
  # =====================================================================
  backend:
    build: .
    container_name: enterprise-rag-backend
    # ports:
    #   - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis-broker:6379/0
    volumes:
      - chroma_data:/app/chroma_storage
      - ./uploads:/app/uploads
    networks:
      - enterprise-rag-net
    restart: unless-stopped
    depends_on:
      - redis-broker
      - postgres

  # =====================================================================
  # 2. REDIS TASK BROKER
  # =====================================================================
  redis-broker:
    image: redis:7-alpine
    container_name: enterprise-rag-redis
    networks:
      - enterprise-rag-net
    # ports:
    #   - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # =====================================================================
  # 3. DISTRIBUTED CELERY ASYNC WORKER POOL
  # =====================================================================
  celery-worker:
    build: .
    container_name: enterprise-rag-worker
    # Overrides the default CMD to boot up as a worker listening to our app instance
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info -P threads --concurrency=2
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis-broker:6379/0
    volumes:
      - chroma_data:/app/chroma_storage
      - ./uploads:/app/uploads
    networks:
      - enterprise-rag-net
    restart: unless-stopped
    depends_on:
      - redis-broker
      - postgres

  # =====================================================================
  # 4. SYSTEM-OF-RECORD RELATIONAL DATABASE
  # =====================================================================
  postgres:
    image: postgres:16-alpine
    container_name: enterprise-rag-postgres
    restart: unless-stopped
    environment:
      # 🔒 Docker Compose automatically reads these right out of your .env file
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_rag}
    ports:
      - "127.0.0.1:5432:5432" # Bound securely to localhost
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - enterprise-rag-net

networks:
  enterprise-rag-net:
    external: true

volumes:
  chroma_data:
  redis_data:
  postgres_data: # 💾 Persistent database volume
